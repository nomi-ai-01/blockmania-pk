<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>BlockMania PK</title>
<style>
:root{--bg:#0b1020;--card:#ffffff12;--line:#ffffff1f;--tx:#f4f6ff;--mu:#9aa6c9;--cy:#3ee0f0;--yl:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;background:radial-gradient(120% 60% at 50% -10%,#2b2f7a 0%,transparent 60%),radial-gradient(80% 50% at 100% 100%,#0e5a73 0%,transparent 60%),var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.screen.show{display:flex}
.wrap{width:100%;max-width:380px;text-align:center}
.mark{display:grid;grid-template-columns:repeat(3,36px);gap:6px;justify-content:center;transform:rotate(-6deg)}
.mark i{height:36px;border-radius:10px;background:#ffffff14}
.c1{background:linear-gradient(#ff8a9b,#e5405e)!important}
.c2{background:linear-gradient(#ffd36e,#f09a1a)!important}
.c3{background:linear-gradient(#6ff2c8,#14b88e)!important}
.c4{background:linear-gradient(#7fd0ff,#2487e0)!important}
.c5{background:linear-gradient(#c3a6ff,#7b4de0)!important}
h1{font-size:clamp(34px,10vw,46px);margin:22px 0 6px;font-weight:900;letter-spacing:-1.5px;line-height:1}
h1 b{background:linear-gradient(90deg,var(--cy),#7aa2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{color:var(--yl)}
.tag{color:var(--mu);font-size:15px;margin:0 0 26px}
.btn{display:block;width:100%;padding:16px;margin:10px 0;border-radius:18px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(120deg,#8a5cff,#5b6cff);box-shadow:0 10px 28px #6a5cff55}
.btn.alt{background:linear-gradient(120deg,#12b8cc,#2a7ff0);box-shadow:0 10px 28px #1aa0ee44}
.btn.soft{background:var(--card);border:1px solid var(--line);box-shadow:none}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:10px;margin-top:14px}
.card{flex:1;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left}
.card small{display:block;color:var(--mu);font-size:13px;font-weight:700;letter-spacing:.6px}
.card strong{display:block;font-size:26px;margin-top:2px;font-variant-numeric:tabular-nums}
.gold{color:var(--yl)}
.credit{margin-top:22px;color:#6f7aa0;font-size:13px}
.bar{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ib{width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px}
.mode{font-size:13px;font-weight:800;letter-spacing:1.5px;color:var(--cy)}
.stats{display:flex;gap:10px;width:100%;max-width:480px}
#streak{height:28px;line-height:28px;font-weight:800;color:var(--yl);font-size:15px;text-align:center}
#boardWrap{position:relative;border-radius:18px;box-shadow:0 18px 50px #0007}
#board{display:block;border-radius:18px}
#pop{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;font-weight:900;font-size:28px;color:#fff;text-shadow:0 3px 14px #000c;opacity:0;line-height:1.15}
#pop small{display:block;font-size:18px;color:var(--yl)}
#pop.go{animation:pop 1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.7)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-56px) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-2px)}}
#tray{display:flex;gap:10px;margin-top:14px}
.slot{position:relative;flex:1;min-width:0;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.slot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.slot.dim{opacity:.3}
.slot.used{opacity:.12}
#ghost{position:fixed;left:0;top:0;display:none;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 14px #0009);will-change:transform}
#over{background:#050914ea}
.modal{width:100%;max-width:360px;padding:26px 22px;border-radius:26px;text-align:center;background:linear-gradient(#202a55,#161d3d);border:1px solid var(--line);box-shadow:0 24px 70px #000a}
.modal h2{font-size:32px;margin:6px 0}
.big{font-size:52px;font-weight:900;color:var(--cy);margin:8px 0;font-variant-numeric:tabular-nums}
#newBest{display:none;color:var(--yl);font-weight:900;font-size:20px;margin-bottom:6px}
#overBest{color:var(--yl);font-size:15px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">

<section id="home" class="screen show">
 <div class="wrap">
  <div class="mark"><i class="c1"></i><i class="c2"></i><i></i><i></i><i class="c3"></i><i class="c4"></i><i class="c5"></i><i></i><i class="c1"></i></div>
  <h1>BLOCK<b>MANIA</b> <span>PK</span></h1>
  <p class="tag">Fit the blocks. Clear the lines. Beat your best.</p>
  <button class="btn" id="playBtn">&#9654; Play</button>
  <button class="btn alt" id="dailyBtn">&#128197; Daily Challenge</button>
  <div class="row">
   <div class="card"><small>BEST SCORE</small><strong class="gold" id="homeBest">0</strong></div>
   <div class="card"><small>TODAY'S BEST</small><strong id="homeDaily">0</strong></div>
  </div>
  <div class="credit">Made by Nauman</div>
 </div>
</section>

<section id="game" class="screen">
 <div class="bar">
  <button class="ib" id="backBtn" aria-label="Home">&#8249;</button>
  <div class="mode" id="modeTag">CLASSIC</div>
  <button class="ib" id="muteBtn" aria-label="Sound">&#128266;</button>
 </div>
 <div class="stats" id="stats">
  <div class="card"><small>SCORE</small><strong id="score">0</strong></div>
  <div class="card"><small>BEST</small><strong class="gold" id="best">0</strong></div>
 </div>
 <div id="streak"></div>
 <div id="boardWrap"><canvas id="board"></canvas><div id="pop"></div></div>
 <div id="tray">
  <div class="slot" id="slot0"><canvas></canvas></div>
  <div class="slot" id="slot1"><canvas></canvas></div>
  <div class="slot" id="slot2"><canvas></canvas></div>
 </div>
</section>

<section id="over" class="screen">
 <div class="modal">
  <div style="font-size:50px">&#128165;</div>
  <h2>Game Over</h2>
  <div class="big" id="finalScore">0</div>
  <div id="newBest">&#127881; New Best Score!</div>
  <div id="overBest"></div>
  <button class="btn" id="againBtn">&#8635; Play Again</button>
  <button class="btn alt" id="shareBtn">&#8599; Share Score</button>
  <button class="btn soft" id="menuBtn">Home</button>
 </div>
</section>

</div>
<canvas id="ghost"></canvas>

<script>
